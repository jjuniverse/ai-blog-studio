name: Collect news headlines
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_news.py'
      - 'scripts/analyze_news.py'
      - 'scripts/collect_published.py'
      - 'tests/test_collect_published.py'
      - 'tests/test_collect_news.py'
      - 'tests/test_analyze_news.py'
      - '.github/workflows/collect-news.yml'
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: headline-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test news ranking rules
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS headlines
        run: python scripts/collect_news.py
      - name: Group headlines and score candidates
        run: python scripts/analyze_news.py
      - name: Read published public blog RSS
        run: python scripts/collect_published.py
      - name: Commit changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/data/candidates.json public/data/published.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update public RSS headlines"
            git push
          fi
