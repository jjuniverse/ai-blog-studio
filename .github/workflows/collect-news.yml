name: Collect news headlines
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: headline-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS headlines
        run: python scripts/collect_news.py
      - name: Commit changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update public RSS headlines"
            git push
          fi
