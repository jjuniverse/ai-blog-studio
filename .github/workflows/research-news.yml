name: Research top news candidates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_news.py'
      - '.github/workflows/research-news.yml'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research selected headlines (daily limit 3)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/research_news.py
      - name: Commit public research briefs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/research.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update daily research leads"
            git push
          fi
